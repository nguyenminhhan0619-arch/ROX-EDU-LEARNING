                                                                        <option value="Done">Done (Đủ)</option>
                                                                        <option value="70">70%</option>
                                                                        <option value="50">50%</option>
                                                                        <option value="Chưa làm">Chưa làm</option>
                                                                    </select>
                                                                </td>
                                                                <td className="py-3 px-4 text-center">
                                                                    <input type="text" value={record.score || ''} onChange={(e) => handleAttendanceFieldChange(st.id, 'score', e.target.value)} placeholder="VD: 8.5" className="w-20 px-2 py-1 text-center text-xs font-bold border rounded-xl" />
                                                                </td>
                                                                <td className="py-3 px-4">
                                                                    <input type="text" value={record.note || ''} onChange={(e) => handleAttendanceFieldChange(st.id, 'note', e.target.value)} placeholder="Ghi chú..." className="w-full px-3 py-1 text-xs border rounded-xl" />
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : null}
                    </main>

                    {isDetailModalOpen && currentDetailStudent && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-6 space-y-4 animate-scaleUp max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <span className="bg-rose-100 text-red-700 text-xs font-extrabold px-2.5 py-1 rounded-md">MÃ HS: {currentDetailStudent.id}</span>
                                        <h3 className="text-2xl font-bold text-slate-800 mt-1">{currentDetailStudent.name}</h3>
                                        <p className="text-xs text-slate-500">Lớp: {currentDetailStudent.class}</p>
                                    </div>
                                    <button onClick={() => setIsDetailModalOpen(false)}><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>

                                <div className="space-y-4">
                                    <h4 className="text-xs font-bold uppercase text-slate-600">Danh sách các khóa học & Trạng thái thu tiền:</h4>
                                    {currentDetailStudent.courses.map((st, idx) => {
                                        const debt = Math.max(0, (Number(st.totalFee) || 0) - (Number(st.paidFee) || 0));
                                        const isPaid = debt <= 0;
                                        return (
                                            <div key={idx} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2.5">
                                                <div className="flex justify-between items-center">
                                                    <div>
                                                        <span className="font-extrabold text-sm text-slate-800">{st.course}</span>
                                                        <p className="text-xs text-slate-500">{st.schedule}</p>
                                                    </div>
                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                        {isPaid ? 'Đã hoàn thành' : `Còn nợ: ${formatVND(debt)}`}
                                                    </span>
                                                </div>

                                                <div className="text-xs text-slate-600 bg-white p-3 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                                    <div>
                                                        <p>Tổng HP: <b>{formatVND(st.totalFee)}</b> | Đã đóng: <b className="text-emerald-600">{formatVND(st.paidFee)}</b></p>
                                                        {st.payDate && <p className="text-[11px] text-slate-400 mt-0.5">Ngày thu: {st.payDate} ({st.payMethod || 'Chuyển khoản'})</p>}
                                                    </div>
                                                    
                                                    <div className="flex items-center space-x-2 self-end sm:self-auto">
                                                        <button 
                                                            onClick={() => handleTogglePaymentStatus(st)} 
                                                            className={`px-3 py-1.5 font-bold rounded-xl text-xs shadow-sm flex items-center space-x-1 ${isPaid ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}
                                                        >
                                                            <i className={`fa-solid ${isPaid ? 'fa-rotate-left' : 'fa-check'}`}></i>
                                                            <span>{isPaid ? 'Chuyển thành CHƯA ĐÓNG' : 'Chuyển thành ĐÃ ĐÓNG'}</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex justify-between items-center pt-3 border-t">
                                    <button onClick={() => handleDeleteStudent(currentDetailStudent.id, currentDetailStudent.name)} className="px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-xs flex items-center space-x-1.5">
                                        <i className="fa-solid fa-trash-can"></i>
                                        <span>Xóa học sinh này</span>
                                    </button>
                                    <button onClick={() => setIsDetailModalOpen(false)} className="px-5 py-2.5 bg-slate-100 rounded-2xl text-xs font-bold">Đóng</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isPayModalOpen && payingRecord && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">Cập nhật Thu tiền: {payingRecord.name}</h3>
                                        <p className="text-xs text-slate-500 font-semibold">Khóa: {payingRecord.course}</p>
                                    </div>
                                    <button onClick={() => setIsPayModalOpen(false)}><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleRecordPayment} className="space-y-3 text-sm">
                                    <div>
                                        <label className="block font-semibold mb-1">Số tiền đã thu (VNĐ) *</label>
                                        <p className="text-[11px] text-slate-400 mb-1">Nhập <b>650000</b> để hoàn thành, hoặc <b>0</b> để đổi về Chưa đóng.</p>
                                        <input type="number" value={payAmount} onChange={(e) => setPayAmount(e.target.value)} placeholder="650000" className="w-full px-3 py-2 border rounded-xl font-bold text-emerald-600 text-base" required />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Ngày thu</label>
                                        <input type="date" value={payDateInput} onChange={(e) => setPayDateInput(e.target.value)} className="w-full px-3 py-2 border rounded-xl font-semibold" />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Phương thức thanh toán</label>
                                        <select value={payMethodSelect} onChange={(e) => setPayMethodSelect(e.target.value)} className="w-full px-3 py-2 border rounded-xl font-semibold">
                                            <option value="Chuyển khoản">Chuyển khoản</option>
                                            <option value="Tiền mặt">Tiền mặt</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Ghi chú</label>
                                        <input type="text" value={payNote} onChange={(e) => setPayNote(e.target.value)} placeholder="Ghi chú..." className="w-full px-3 py-1 text-xs border rounded-xl" />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setIsPayModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-emerald-600 text-white rounded-xl font-bold text-xs">Lưu Thay Đổi & Sync Sheet</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAddStudentModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold">Thêm Học Sinh Mới</h3>
                                    <button onClick={() => setIsAddStudentModalOpen(false)}><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleAddNewStudent} className="space-y-3 text-sm">
                                    <div>
                                        <label className="block font-semibold mb-1">Họ và Tên *</label>
                                        <input type="text" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} placeholder="VD: Nguyễn Văn A" className="w-full px-3 py-2 border rounded-xl font-bold" required />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Lớp *</label>
                                        <select value={newStudentClass} onChange={(e) => setNewStudentClass(e.target.value)} className="w-full px-3 py-2 border rounded-xl font-bold">
                                            <option value="10">Lớp 10</option>
                                            <option value="11">Lớp 11</option>
                                            <option value="12A">Lớp 12A</option>
                                            <option value="12B">Lớp 12B (4 buổi)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Khóa Học *</label>
                                        <input type="text" value={newStudentCourse} onChange={(e) => setNewStudentCourse(e.target.value)} placeholder="VD: L10-Khóa 1" className="w-full px-3 py-2 border rounded-xl" required />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Lịch học *</label>
                                        <input type="text" value={newStudentSchedule} onChange={(e) => setNewStudentSchedule(e.target.value)} placeholder="VD: 16/08/2026 - 14/09/2026 (8 buổi)" className="w-full px-3 py-2 border rounded-xl" required />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setIsAddStudentModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-red-600 text-white rounded-xl font-bold">Thêm HS</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAddCourseModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold">Thêm Khóa Học Mới (Lớp {attendanceClassFilter})</h3>
                                    <button onClick={() => setIsAddCourseModalOpen(false)}><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleAddNewCourse} className="space-y-3 text-sm">
                                    <div>
                                        <label className="block font-semibold mb-1">Tên Khóa Học *</label>
                                        <input type="text" value={newCourseName} onChange={(e) => setNewCourseName(e.target.value)} placeholder="VD: L10-Khóa 3" className="w-full px-3 py-2 border rounded-xl font-bold" required />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1">Ngày Khai Giảng *</label>
                                        <input type="date" value={newCourseStartDate} onChange={(e) => setNewCourseStartDate(e.target.value)} className="w-full px-3 py-2 border rounded-xl" required />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setIsAddCourseModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-red-600 text-white rounded-xl font-bold">Tạo Khóa</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAppsScriptModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4">
                                <h3 className="text-lg font-bold">Cấu Hình Google Sheets URL</h3>
                                <input type="text" value={appsScriptUrl} onChange={(e) => setAppsScriptUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="w-full px-3.5 py-2 border rounded-xl font-mono text-xs" />
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button onClick={() => setIsAppsScriptModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Hủy</button>
                                    <button onClick={() => { fetchCloudData(appsScriptUrl, true); setIsAppsScriptModalOpen(false); }} className="px-5 py-2 bg-red-600 text-white rounded-xl font-bold">Lưu & Tải</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isLoginModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 text-center">
                                <h3 className="text-lg font-bold">Đăng Nhập Giáo Viên</h3>
                                <p className="text-xs text-slate-500">Vui lòng nhập mật khẩu điểm danh</p>
                                <form onSubmit={handleTeacherLogin} className="space-y-3">
                                    <input type="password" value={teacherPasswordInput} onChange={(e) => setTeacherPasswordInput(e.target.value)} placeholder="••••" className="w-full px-4 py-3 border rounded-2xl text-center font-mono font-bold text-lg" required autoFocus />
                                    <div className="flex justify-center space-x-2">
                                        <button type="button" onClick={() => setIsLoginModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-red-600 text-white rounded-xl font-bold">Xác Nhận</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAdminLoginModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 text-center">
                                <h3 className="text-lg font-bold">Quản Lý Học Phí</h3>
                                <p className="text-xs text-slate-500">Vui lòng nhập mật khẩu quản lý</p>
                                <form onSubmit={handleAdminLogin} className="space-y-3">
                                    <input type="password" value={adminPasswordInput} onChange={(e) => setAdminPasswordInput(e.target.value)} placeholder="••••" className="w-full px-4 py-3 border rounded-2xl text-center font-mono font-bold text-lg" required autoFocus />
                                    <div className="flex justify-center space-x-2">
                                        <button type="button" onClick={() => setIsAdminLoginModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-red-600 text-white rounded-xl font-bold">Truy Cập</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
